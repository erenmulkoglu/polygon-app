<div class="profile-container">
  <h2 class="title">👤 Profil Bilgileri</h2>
  
  <form [formGroup]="profileForm" (ngSubmit)="onUpdateProfile()" class="profile-form">
    <div class="form-group">
      <label>Ad Soyad:</label>
      <input type="text" formControlName="name" placeholder="Ad Soyad" />
    </div>

    <div class="form-group">
      <label>Email:</label>
      <input type="email" formControlName="email" placeholder="Email" />
    </div>

    <div class="form-group">
      <label>Mevcut Şifre:</label>
      <input type="password" formControlName="currentPassword" placeholder="Mevcut Şifre" />
    </div>

    <div class="form-group">
      <label>Yeni Şifre:</label>
      <input type="password" formControlName="newPassword" placeholder="Yeni Şifre" />
    </div>

    <div class="form-group">
      <label>Yeni Şifre (Tekrar):</label>
      <input type="password" formControlName="confirmNewPassword" placeholder="Yeni Şifre (Tekrar)" />
    </div>

    <button type="submit" [disabled]="isLoading">
      {{ isLoading ? 'Güncelleniyor...' : 'Güncelle' }}
    </button>
  </form>

  <div *ngIf="successMessage" class="success-message">
   {{ successMessage }}
  </div>

  <div *ngIf="errorMessage" class="error-message">
     {{ errorMessage }}
  </div>
</div>
